name: Android APK

on:
  push:
    branches: [Master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the APK to a GitHub Release on tag pushes

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The GitHub-hosted Ubuntu image already ships the Android SDK
      # (ANDROID_HOME); AGP downloads any missing platform/build-tools itself.
      - name: Check Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [[ -z "$SDK" || ! -d "$SDK" ]]; then
            echo "::error::Android SDK not found on runner (ANDROID_HOME unset)."
            exit 1
          fi
          echo "sdk.dir=$SDK" > local.properties
          echo "Android SDK: $SDK"
          ls "$SDK"

      # Gradle is provided by the action (pinned version) instead of a committed
      # gradle-wrapper.jar; see README "Yerelde derleme".
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"

      - name: Determine version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.1.0-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      # Optional release keystore from repository secrets. Without it the APK is
      # signed with the runner's (throw-away) debug key.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release keystore found."
          else
            echo "::warning::KEYSTORE_BASE64 secret not set; APK is signed with a debug key."
          fi

      # On failure, the compiler errors are also emitted as annotations so they
      # are visible on the run page without signing in.
      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if ! gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            grep -E '^e: |error:|What went wrong|FAILURE|Could not|> ' "$RUNNER_TEMP/build.log" \
              | grep -v '^\s*at ' | head -n 10 \
              | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/HaberDerleyici-${VERSION_NAME}.apk"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: HaberDerleyici-${{ env.VERSION_NAME }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
